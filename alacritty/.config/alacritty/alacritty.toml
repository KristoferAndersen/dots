[colors.primary]
background = "#1E1E1E"
foreground = "#D4D4D4"

[font]
size = 12

[font.bold]
family = "InconsolataGo Nerd Font"
style = "Bold"

[font.bold_italic]
family = "InconsolataGo Nerd Font"
style = "Bold Italic"

[font.italic]
family = "InconsolataGo Nerd Font"
style = "Italic"

[font.normal]
family = "InconsolataGo Nerd Font"
style = "Regular"

[window]
opacity = 0.95
option_as_alt = "Both"

[window.padding]
x = 8
y = 8

[[hints.enabled]]
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`]+"
hyperlinks = true
command = "open"
post_processing = true
mouse = { enabled = true, mods = "Shift" }
binding = { key = "U", mods = "Control|Shift" }

